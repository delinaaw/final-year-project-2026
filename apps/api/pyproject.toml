[project]
name = "voiceform-api"
version = "0.1.0"
description = "VoiceForm API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.3",
    "redis>=5.1.0",
    "arq>=0.26.1",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.9.0",
    "authlib>=1.3.2",
    "httpx>=0.27.2",
    "aiosmtplib>=3.0.2",
    "jinja2>=3.1.4",
    "aioboto3>=13.2.0",
    "python-multipart>=0.0.12",
    "deepgram-sdk>=3.7.0",
    "elevenlabs>=1.9.0",
    "anthropic>=0.34.0",
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.14.0",
    "slowapi>=0.1.9",
    "qrcode[pil]>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2",
    "aiosqlite>=0.20.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "factory-boy>=3.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voiceform"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "TCH", "RUF", "ASYNC", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["voiceform"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
